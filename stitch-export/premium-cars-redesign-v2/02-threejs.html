<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Luxury Sport Car Silhouette / Abstract Geometric Car
const carGroup = new THREE.Group();

// Body
const bodyGeom = new THREE.BoxGeometry(4, 0.6, 2);
const bodyMat = new THREE.MeshPhongMaterial({ color: 0x1C1C21, shininess: 100 });
const body = new THREE.Mesh(bodyGeom, bodyMat);
carGroup.add(body);

// Cabin
const cabinGeom = new THREE.BoxGeometry(2, 0.5, 1.6);
const cabin = new THREE.Mesh(cabinGeom, bodyMat);
cabin.position.y = 0.5;
cabin.position.x = -0.2;
carGroup.add(cabin);

// Wheels
const wheelGeom = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 32);
const wheelMat = new THREE.MeshPhongMaterial({ color: 0x0B0B0C });
const wheels = [];
const wheelPos = [[1.2, -0.3, 0.9], [1.2, -0.3, -0.9], [-1.2, -0.3, 0.9], [-1.2, -0.3, -0.9]];
wheelPos.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeom, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(...pos);
    carGroup.add(wheel);
});

// Accent lights
const lightGeom = new THREE.BoxGeometry(0.1, 0.2, 0.5);
const lightMat = new THREE.MeshBasicMaterial({ color: 0xFF6A00 });
const headLightL = new THREE.Mesh(lightGeom, lightMat);
headLightL.position.set(2, 0.1, 0.6);
carGroup.add(headLightL);
const headLightR = new THREE.Mesh(lightGeom, lightMat);
headLightR.position.set(2, 0.1, -0.6);
carGroup.add(headLightR);

scene.add(carGroup);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);
const spotLight = new THREE.SpotLight(0xFF6A00, 1);
spotLight.position.set(5, 10, 5);
scene.add(spotLight);

camera.position.z = 6;
camera.position.y = 1;

function animate() {
    requestAnimationFrame(animate);
    carGroup.rotation.y += 0.005;
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
